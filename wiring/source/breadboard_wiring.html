<!doctype html>
<html><head><meta charset="utf-8"><title>Breadboard Wiring</title>
<!-- Source of wiring/breadboard_wiring.png. Edit here, then re-make the PNG. -->
<style>body{margin:0;background:#111614}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <style>
      .box{fill:#1b2220;stroke:#46524f;stroke-width:2}
      .t{fill:#eef4f2;font-size:24px;font-weight:700}
      .s{fill:#b9c6c2;font-size:16px}
      .pin{fill:#eef4f2;font-size:19px;font-weight:700}
      .w{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .lbl{fill:#b9c6c2;font-size:15px}
    </style>
  </defs>
  <rect width="1700" height="1080" fill="#111614"/>
  <text x="60" y="58" font-size="32" font-weight="700" fill="#eef4f2">Breadboard wiring · Uno R3 + analog EMG sensor + MG996R (29 Oct)</text>
  <text x="60" y="90" font-size="18" fill="#b9c6c2">Sketch: arduino_ide_code/working_code_uno_r3_9v_analog_emg_hand_holder_mg996r_29oct</text>

  <!-- ===== batteries ===== -->
  <rect x="70" y="140" width="240" height="120" rx="14" class="box" stroke="#f08a4b"/>
  <text x="95" y="190" class="t">Battery 1</text><text x="95" y="220" class="s">9 V</text>
  <text x="285" y="186" class="pin" text-anchor="end">+</text><text x="285" y="241" class="pin" text-anchor="end">−</text>

  <rect x="70" y="370" width="240" height="120" rx="14" class="box" stroke="#f08a4b"/>
  <text x="95" y="420" class="t">Battery 2</text><text x="95" y="450" class="s">9 V</text>
  <text x="285" y="416" class="pin" text-anchor="end">+</text><text x="285" y="471" class="pin" text-anchor="end">−</text>

  <!-- ===== EMG sensor ===== -->
  <rect x="560" y="140" width="330" height="370" rx="14" class="box" stroke="#3fae84"/>
  <text x="725" y="125" class="t" text-anchor="middle">Muscle Sensor V3</text>
  <text x="725" y="300" class="s" text-anchor="middle">analog EMG sensor</text>
  <text x="580" y="186" class="pin">+Vs</text>
  <text x="580" y="326" class="pin">GND</text>
  <text x="580" y="471" class="pin">−Vs</text>
  <text x="870" y="256" class="pin" text-anchor="end">SIG</text>
  <text x="725" y="495" class="s" text-anchor="middle">electrode cable ▼</text>

  <!-- ===== Arduino Uno ===== -->
  <rect x="1080" y="140" width="340" height="420" rx="14" class="box" stroke="#2f7bd6"/>
  <text x="1250" y="125" class="t" text-anchor="middle">Arduino Uno R3</text>
  <text x="1100" y="256" class="pin">A0</text>
  <text x="1100" y="406" class="pin">GND</text>
  <text x="1160" y="540" class="pin" text-anchor="middle">D9</text>
  <text x="1250" y="540" class="pin" text-anchor="middle">5V</text>
  <text x="1340" y="540" class="pin" text-anchor="middle">GND</text>
  <text x="1400" y="206" class="pin" text-anchor="end">USB</text>

  <!-- ===== laptop ===== -->
  <rect x="1500" y="140" width="170" height="130" rx="14" class="box" stroke="#f08a4b"/>
  <text x="1585" y="190" class="t" text-anchor="middle">Laptop</text>
  <text x="1585" y="218" class="s" text-anchor="middle">on battery,</text>
  <text x="1585" y="240" class="s" text-anchor="middle">charger unplugged</text>

  <!-- ===== servo ===== -->
  <rect x="1110" y="720" width="280" height="110" rx="14" class="box" stroke="#7d8a90"/>
  <text x="1250" y="770" class="t" text-anchor="middle">MG996R servo</text>
  <text x="1250" y="800" class="s" text-anchor="middle">orange/yellow · red · brown</text>

  <!-- ===== hand holder ===== -->
  <rect x="1440" y="700" width="230" height="150" rx="14" class="box" stroke="#7d8a90" stroke-dasharray="6 5"/>
  <text x="1460" y="736" class="t" font-size="20">Hand holder</text>
  <text x="1460" y="764" class="s">3 gears → spool</text>
  <text x="1460" y="788" class="s">→ nylon line</text>
  <text x="1460" y="812" class="s">→ 4 fingers open</text>
  <path d="M1390 775 H1440" stroke="#7d8a90" stroke-width="4" stroke-dasharray="3 6"/>

  <!-- ===== forearm + electrodes ===== -->
  <rect x="70" y="760" width="520" height="150" rx="75" fill="#3a2a22" stroke="#8a6a55" stroke-width="2"/>
  <text x="95" y="745" class="t" font-size="20">Forearm</text>
  <circle cx="200" cy="835" r="26" fill="#c9d3d0" stroke="#eef4f2" stroke-width="2"/>
  <circle cx="275" cy="835" r="26" fill="#c9d3d0" stroke="#eef4f2" stroke-width="2"/>
  <circle cx="520" cy="835" r="26" fill="#e8b4b4" stroke="#eef4f2" stroke-width="2"/>
  <text x="237" y="940" class="lbl" text-anchor="middle">2 signal pads on the muscle</text>
  <text x="237" y="962" class="lbl" text-anchor="middle">~2 cm apart, must not touch</text>
  <text x="520" y="940" class="lbl" text-anchor="middle">reference pad</text>
  <text x="520" y="962" class="lbl" text-anchor="middle">on the elbow bone</text>
  <path d="M725 510 V665 H590 M590 665 C 520 680, 230 700, 200 809 M590 665 C 530 690, 300 710, 275 809 M590 665 C 570 700, 530 740, 520 809" class="w" stroke="#9aa6a3" stroke-width="3"/>

  <!-- ===== wires ===== -->
  <!-- B1 + to +Vs (red) -->
  <path d="M310 180 H560" class="w" stroke="#e5484d"/>
  <!-- ground junction: B1 −, B2 +, sensor GND (grey) -->
  <path d="M310 235 H420 V410 H310" class="w" stroke="#9aa6a3"/>
  <path d="M420 320 H560" class="w" stroke="#9aa6a3"/>
  <circle cx="420" cy="320" r="8" fill="#9aa6a3"/>
  <circle cx="420" cy="410" r="8" fill="#9aa6a3"/>
  <!-- shared ground to the Uno (grey), hops over the electrode cable -->
  <path d="M420 410 V620 H714 A11 11 0 0 1 736 620 H1000 V400 H1080" class="w" stroke="#9aa6a3"/>
  <!-- B2 − to −Vs (blue), hops over the ground line -->
  <path d="M310 465 H409 A11 11 0 0 1 431 465 H560" class="w" stroke="#3b82f6"/>
  <!-- SIG to A0 (purple) -->
  <path d="M890 250 H1080" class="w" stroke="#a78bfa"/>
  <!-- servo wires -->
  <path d="M1160 560 V720" class="w" stroke="#f5b82e"/>
  <path d="M1250 560 V720" class="w" stroke="#e5484d"/>
  <path d="M1340 560 V720" class="w" stroke="#8b5a3c"/>
  <!-- USB (orange power + data) -->
  <path d="M1420 200 H1500" class="w" stroke="#f08a4b" stroke-width="7"/>

  <!-- wire labels -->
  <text x="440" y="170" class="lbl">red</text>
  <text x="440" y="455" class="lbl">blue</text>
  <text x="940" y="240" class="lbl">purple: SIG → A0</text>
  <text x="760" y="606" class="lbl">grey: shared ground</text>
  <text x="1170" y="650" class="lbl">signal</text>
  <text x="1260" y="680" class="lbl">+5 V</text>
  <text x="1350" y="650" class="lbl">GND</text>
  <text x="1424" y="186" class="lbl">USB</text>

  <!-- ===== notes ===== -->
  <rect x="625" y="700" width="465" height="360" rx="14" fill="#171d1b" stroke="#2c3734"/>
  <text x="645" y="736" class="t" font-size="20">How the power flows</text>
  <text x="645" y="768" class="s" fill="#f2b38d">• 2 × 9 V → EMG sensor ONLY</text>
  <text x="645" y="792" class="s">   (B1 + → +Vs, B1 − &amp; B2 + → GND, B2 − → −Vs)</text>
  <text x="645" y="822" class="s" fill="#f2b38d">• Laptop USB → Uno → servo (Uno 5V pin)</text>
  <text x="645" y="852" class="s">• Grey = one shared ground for everything</text>
  <text x="645" y="890" class="t" font-size="18" fill="#ff8a8a">⚠ Check</text>
  <text x="645" y="918" class="s" fill="#f1d0d0">• Servo can pull ~2.5 A, USB gives ~0.5 A.</text>
  <text x="645" y="940" class="s" fill="#f1d0d0">  Resets or twitching → own 5–6 V supply,</text>
  <text x="645" y="962" class="s" fill="#f1d0d0">  grounds joined.</text>
  <text x="645" y="990" class="s" fill="#f1d0d0">• A0 max 5 V: measure SIG at full effort.</text>
  <text x="645" y="1018" class="s" fill="#f1d0d0">• Clip the 9 V batteries on LAST, off FIRST.</text>
  <text x="645" y="1044" class="s" fill="#f1d0d0">• Reference snap = beeps with plug base metal.</text>
</svg>
</body></html>
